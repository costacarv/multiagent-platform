namespace: agents-prod

api:
  name: multiagent-api
  replicaCount: 1
  image:
    repository: "617087574557.dkr.ecr.us-east-1.amazonaws.com/multiagent-api"
    tag: "1.0.0"
    pullPolicy: Always
  port: 8000
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "450Mi"
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

frontend:
  name: multiagent-frontend
  replicaCount: 1
  image:
    repository: "617087574557.dkr.ecr.us-east-1.amazonaws.com/multiagent-frontend"
    tag: "1.0.0"
    pullPolicy: Always
  port: 8501
  serviceType: LoadBalancer
  resources:
    requests:
      cpu: "150m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "450Mi"

secrets:
  groqApiKey: ""
  apiKey: ""
