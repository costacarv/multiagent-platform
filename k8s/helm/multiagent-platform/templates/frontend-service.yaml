apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-05777e1025aa11579,subnet-05fe2ad3405e9995b"
spec:
  type: {{ .Values.frontend.serviceType }}
  selector:
    app: {{ .Values.frontend.name }}
  ports:
    - protocol: TCP
      port: 80
      targetPort: {{ .Values.frontend.port }}
